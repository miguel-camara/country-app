<nav class="cloth-tabs" aria-label="Regiones y búsquedas">
  @for (region of regions; track region) {
    <a
      class="cloth-tab"
      routerLink="/country/by-region"
      [queryParams]="{ region: region }"
      routerLinkActive="is-current"
      [class.is-current]="isRegion(region)"
    >
      {{ labels[region] }}
    </a>
  }

  <a class="ticket" routerLink="/country/by-capital" routerLinkActive="is-current">Capital</a>
  <a class="ticket" routerLink="/country/by-country" routerLinkActive="is-current">País</a>
</nav>
