<h1 class="text-2xl">Por región</h1>
<h3 class="text-lg">Seleccione una región</h3>

<section class="row mt-2">
  <div class="flex-col">
    @for (region of regions; track region) {
      <button
        class="btn mr-2 btn-outline w-25"
        (click)="selectedRegion.set(region)"
        [class.btn-primary]="selectedRegion() === region"
      >
        {{ region }}
      </button>
    }
  </div>
</section>

@if (countryResource.hasValue()) {
  <!-- country-list -->
  <country-list [countries]="countryResource.value()" [hasValues]="true" />
} @else {
  <country-list [errorMessage]="countryResource.error()?.message" />
}

@if (countryResource.isLoading()) {
  <app-loading />
}
