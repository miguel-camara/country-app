<article class="plate-page">
  <h1>{{ country().name }}</h1>
  <img class="plate-flag" [src]="country().flagSvg" [alt]="'Bandera de ' + country().name" />

  <dl class="plate-facts">
    <div>
      <dt>Capital</dt>
      <dd>{{ country().capital || '—' }}</dd>
    </div>
    <div>
      <dt>Población</dt>
      <dd>{{ country().population | number }}</dd>
    </div>
    <div>
      <dt>Región</dt>
      <dd>{{ country().region }}</dd>
    </div>
    <div>
      <dt>Subregión</dt>
      <dd>{{ country().subRegion }}</dd>
    </div>
  </dl>
</article>
