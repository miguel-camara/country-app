<search-input
  (value)="query.set($event)"
  placeholder="Buscar por país"
  [initialValue]="query()"
  [debounceTime]="750"
/>

@if (countryResource.hasValue()) {
  <country-list [countries]="countryResource.value()" [hasValues]="true" />
} @else {
  <country-list [errorMessage]="countryResource.error()?.message" />
}

@if (countryResource.isLoading()) {
  <app-loading />
}
