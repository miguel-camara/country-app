<div class="map-stage">
  <img class="map-plate is-backdrop" src="/assets/plates/map-lookup.png" alt="" />
  <img class="compass" src="/assets/plates/compass.png" alt="" />
</div>

<aside class="rail">
  <h1 class="rail-title">Por país</h1>
  <search-input
    (value)="query.set($event)"
    placeholder="Buscar destino por nombre"
    [initialValue]="query()"
    [debounceTime]="750"
  />

  @if (countryResource.isLoading()) {
    <p class="loading-copy">Buscando en el índice…</p>
  }

  @if (countryResource.hasValue()) {
    <country-list [countries]="countryResource.value()" [hasValues]="true" />
  } @else {
    <country-list [errorMessage]="countryResource.error()?.message" />
  }
</aside>
